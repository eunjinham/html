<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <div class="container">
        <h2 style="color: #2D5A8C;">Your Shopping Cart</h2>
        <div>
            <table class="cart-table">
                <thead>
                    <tr>
                        <th colspan="2">ITEM</th>
                        <th>AMOUNT</th>
                        <th>PRICE</th>
                        <th>TOTAL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td width="10%"><img src="img/sony1.png" alt="Product Image" style="width: 100px; height: auto;"></td>
                        <td>
                            <h4>SONY</h4>
                            <p>FE 70-200 mm F2.8 GM OSS</p>
                        </td>
                        <td>1</td>
                        <td>€1979.00</td>
                        <td>€1979.00</td>
                    </tr>
                    <tr>
                        <td><img src="img/sony2.png" alt="Product Image" style="width: 100px; height: auto;"></td>
                        <td>
                            <h4>SONY</h4>
                            <p>Sonnar T* E 24mm F1.8 Z.A</p>
                        </td>
                        <td>1</td>
                        <td>€989.00</td>
                        <td>€989.00</td>
                    </tr>
                    <tr>
                        <td class="total" colspan="5">€2968.00</td>
                    </tr>
                </tbody>
            </table>
        </div>  
        <div>
            <a href="#" class="edit-cart-link">Edit your shopping cart</a>
            <button class="payment-button">Choose payment method</button>       
        </div>
    </div>
</body>
</html>
